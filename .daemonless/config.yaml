type: base
build:
  auto_version: true
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: "15.1-pkg"
      args:
        FREEBSD_RELEASE: "15.1"
        PKG_BRANCH: quarterly
      aliases: ["latest", "15", "15-pkg"]
    - tag: "15.1-pkg-latest"
      args:
        FREEBSD_RELEASE: "15.1"
        PKG_BRANCH: latest
      aliases: ["15-latest", "15-pkg-latest"]

cit:
  mode: shell
  puid: false
